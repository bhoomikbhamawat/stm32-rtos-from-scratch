<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 820 420' width='820' height='420' role='img' aria-label="Under a 10 kHz interrupt load, 99.4% of switches still take 104 cycles" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Under a 10 kHz interrupt load, 99.4% of switches still take 104 cycles</title><rect x='0.5' y='0.5' width='819' height='419' rx='12' fill='#ffffff' stroke='#d0d7de'/><text x='32' y='44' font-size='18' font-weight='600' fill='#1f2328' text-anchor='start'>Under a 10 kHz interrupt load, 99.4% of switches still take 104 cycles</text><text x='32' y='68' font-size='13' font-weight='400' fill='#59636e' text-anchor='start'>10,000 switches, O(1) scheduler, SysTick 1 kHz + TIM2 10 kHz running · worst case 261 cycles (1.55 µs)</text><line x1='300.0' x2='300.0' y1='96' y2='352' stroke='#eaeef2'/><text x='300.0' y='372' font-size='12' font-weight='400' fill='#59636e' text-anchor='middle'>1</text><line x1='400.0' x2='400.0' y1='96' y2='352' stroke='#eaeef2'/><text x='400.0' y='372' font-size='12' font-weight='400' fill='#59636e' text-anchor='middle'>10</text><line x1='500.0' x2='500.0' y1='96' y2='352' stroke='#eaeef2'/><text x='500.0' y='372' font-size='12' font-weight='400' fill='#59636e' text-anchor='middle'>100</text><line x1='600.0' x2='600.0' y1='96' y2='352' stroke='#eaeef2'/><text x='600.0' y='372' font-size='12' font-weight='400' fill='#59636e' text-anchor='middle'>1,000</text><line x1='700.0' x2='700.0' y1='96' y2='352' stroke='#eaeef2'/><text x='700.0' y='372' font-size='12' font-weight='400' fill='#59636e' text-anchor='middle'>10,000</text><text x='500.0' y='394' font-size='12' font-weight='400' fill='#59636e' text-anchor='middle'>Number of switches (log scale)</text><text x='32' y='126' font-size='14' font-weight='600' fill='#1f2328' text-anchor='start'>103–104 cycles</text><text x='32' y='146' font-size='12' font-weight='400' fill='#59636e' text-anchor='start'>normal switch, no interference</text><rect x='300' y='110' width='399.7' height='28' rx='4' fill='#2a78d6'><title>103–104 cycles: 9,936 switches</title></rect><text x='707.7211582832505' y='129' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>9,936</text><text x='32' y='186' font-size='14' font-weight='600' fill='#1f2328' text-anchor='start'>138–141 cycles</text><text x='32' y='206' font-size='12' font-weight='400' fill='#59636e' text-anchor='start'>timer IRQ tail-chained after PendSV</text><rect x='300' y='170' width='167.2' height='28' rx='4' fill='#afb8c1'><title>138–141 cycles: 47 switches</title></rect><text x='475.20978579357177' y='189' font-size='13' font-weight='400' fill='#1f2328' text-anchor='start'>47</text><text x='32' y='246' font-size='14' font-weight='600' fill='#1f2328' text-anchor='start'>151–152 cycles</text><text x='32' y='266' font-size='12' font-weight='400' fill='#59636e' text-anchor='start'>timer IRQ at a later point</text><rect x='300' y='230' width='117.6' height='28' rx='4' fill='#afb8c1'><title>151–152 cycles: 15 switches</title></rect><text x='425.60912590556813' y='249' font-size='13' font-weight='400' fill='#1f2328' text-anchor='start'>15</text><text x='32' y='306' font-size='14' font-weight='600' fill='#1f2328' text-anchor='start'>260–261 cycles</text><text x='32' y='326' font-size='12' font-weight='400' fill='#59636e' text-anchor='start'>1 ms tick just before a yield</text><rect x='300' y='290' width='30.1' height='28' rx='4' fill='#afb8c1'><title>260–261 cycles: 2 switches</title></rect><text x='338.1029995663981' y='309' font-size='13' font-weight='400' fill='#1f2328' text-anchor='start'>2</text><line x1='300' x2='300' y1='96' y2='352' stroke='#8c959f'/></svg>