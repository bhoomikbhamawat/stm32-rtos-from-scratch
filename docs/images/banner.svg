<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1280 640' width='1280' height='640' role='img' aria-label='STM32 RTOS from Scratch: 104-cycle context switch, 55% faster with an O(1) scheduler' font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><title>STM32 RTOS from Scratch</title><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#0d1117'/><stop offset='1' stop-color='#13233a'/></linearGradient></defs><rect width='1280' height='640' rx='0' fill='url(#g)'/><path d='M0 96H180l24 -24H1280' stroke='#1f3b5c' stroke-width='2' fill='none'/><path d='M0 544H180l24 24H1280' stroke='#1f3b5c' stroke-width='2' fill='none'/><text x='80' y='150' font-size='22' font-weight='600' fill='#7fb2ee' text-anchor='start'>BARE-METAL  ·  ARM CORTEX-M4F  ·  STM32F407</text><text x='80' y='232' font-size='76' font-weight='700' fill='#ffffff' text-anchor='start'>STM32 RTOS from Scratch</text><text x='80' y='286' font-size='25' font-weight='400' fill='#c9d1d9' text-anchor='start'>Preemptive kernel · PendSV context switch · O(1) bitmap scheduler · MPU-6050 I2C driver</text><rect x='80' y='340' width='352' height='150' rx='14' fill='#16263c' stroke='#2a78d6' stroke-width='3'/><text x='108' y='418' font-size='52' font-weight='700' fill='#ffffff' text-anchor='start'>104 cycles</text><text x='108' y='460' font-size='18' font-weight='400' fill='#9fb3c8' text-anchor='start'>context switch, 619 ns at 168 MHz</text><rect x='464' y='340' width='352' height='150' rx='14' fill='#16263c' stroke='#2a78d6' stroke-width='1.5'/><text x='492' y='418' font-size='52' font-weight='700' fill='#ffffff' text-anchor='start'>−55%</text><text x='492' y='460' font-size='18' font-weight='400' fill='#9fb3c8' text-anchor='start'>switch time vs the O(n) scheduler</text><rect x='848' y='340' width='352' height='150' rx='14' fill='#16263c' stroke='#2a78d6' stroke-width='1.5'/><text x='876' y='418' font-size='52' font-weight='700' fill='#ffffff' text-anchor='start'>261 cycles</text><text x='876' y='460' font-size='18' font-weight='400' fill='#9fb3c8' text-anchor='start'>worst case under 10 kHz IRQ load</text><text x='80' y='580' font-size='21' font-weight='400' fill='#9fb3c8' text-anchor='start'>No HAL · No CMSIS · Register-level C and ARM assembly · Measured on real hardware</text></svg>