<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 820 606' width='820' height='606' role='img' aria-label="Architecture: tasks, kernel, drivers and hardware layers" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Architecture: tasks, kernel, drivers and hardware layers</title><rect x='0.5' y='0.5' width='819' height='605' rx='12' fill='#ffffff' stroke='#d0d7de'/><text x='24' y='40' font-size='18' font-weight='600' fill='#1f2328' text-anchor='start'>Five tasks on a hand-written kernel: no HAL, no CMSIS</text><rect x='24' y='60' width='772' height='112' rx='10' fill='#f6f8fa' stroke='#d0d7de'/><text x='40' y='84' font-size='13' font-weight='600' fill='#59636e' text-anchor='start'>Tasks · thread mode · each on its own stack (PSP)</text><rect x='40.0' y='96' width='135.2' height='60' rx='8' fill='#ffffff' stroke='#8c959f' stroke-width='1'/><text x='107.6' y='121' font-size='14' font-weight='600' fill='#1f2328' text-anchor='middle'>bench A / B</text><text x='107.6' y='141' font-size='12' font-weight='400' fill='#59636e' text-anchor='middle'>prio 4, runs once</text><rect x='191.2' y='96' width='135.2' height='60' rx='8' fill='#ffffff' stroke='#8c959f' stroke-width='1'/><text x='258.79999999999995' y='121' font-size='14' font-weight='600' fill='#1f2328' text-anchor='middle'>imu</text><text x='258.79999999999995' y='141' font-size='12' font-weight='400' fill='#59636e' text-anchor='middle'>prio 3, sensor poll</text><rect x='342.4' y='96' width='135.2' height='60' rx='8' fill='#ffffff' stroke='#8c959f' stroke-width='1'/><text x='410.0' y='121' font-size='14' font-weight='600' fill='#1f2328' text-anchor='middle'>proc</text><text x='410.0' y='141' font-size='12' font-weight='400' fill='#59636e' text-anchor='middle'>prio 2, filter</text><rect x='493.6' y='96' width='135.2' height='60' rx='8' fill='#ffffff' stroke='#8c959f' stroke-width='1'/><text x='561.1999999999999' y='121' font-size='14' font-weight='600' fill='#1f2328' text-anchor='middle'>stats</text><text x='561.1999999999999' y='141' font-size='12' font-weight='400' fill='#59636e' text-anchor='middle'>prio 1, 1 Hz LED</text><rect x='644.8' y='96' width='135.2' height='60' rx='8' fill='#ffffff' stroke='#8c959f' stroke-width='1'/><text x='712.4' y='121' font-size='14' font-weight='600' fill='#1f2328' text-anchor='middle'>idle</text><text x='712.4' y='141' font-size='12' font-weight='400' fill='#59636e' text-anchor='middle'>prio 0, WFI sleep</text><rect x='24' y='188' width='772' height='112' rx='10' fill='#f6f8fa' stroke='#d0d7de'/><text x='40' y='212' font-size='13' font-weight='600' fill='#59636e' text-anchor='start'>Kernel · handler mode · main stack (MSP)</text><rect x='40.0' y='224' width='173.0' height='60' rx='8' fill='#e8f1fb' stroke='#2a78d6' stroke-width='2'/><text x='126.5' y='249' font-size='14' font-weight='600' fill='#1f2328' text-anchor='middle'>Scheduler</text><text x='126.5' y='269' font-size='12' font-weight='400' fill='#59636e' text-anchor='middle'>O(1) bitmap + CLZ</text><rect x='229.0' y='224' width='173.0' height='60' rx='8' fill='#ffffff' stroke='#8c959f' stroke-width='1'/><text x='315.5' y='249' font-size='14' font-weight='600' fill='#1f2328' text-anchor='middle'>PendSV</text><text x='315.5' y='269' font-size='12' font-weight='400' fill='#59636e' text-anchor='middle'>context switch</text><rect x='418.0' y='224' width='173.0' height='60' rx='8' fill='#ffffff' stroke='#8c959f' stroke-width='1'/><text x='504.5' y='249' font-size='14' font-weight='600' fill='#1f2328' text-anchor='middle'>SysTick</text><text x='504.5' y='269' font-size='12' font-weight='400' fill='#59636e' text-anchor='middle'>1 kHz tick</text><rect x='607.0' y='224' width='173.0' height='60' rx='8' fill='#ffffff' stroke='#8c959f' stroke-width='1'/><text x='693.5' y='249' font-size='14' font-weight='600' fill='#1f2328' text-anchor='middle'>Sync</text><text x='693.5' y='269' font-size='12' font-weight='400' fill='#59636e' text-anchor='middle'>sem, mutex + PI</text><rect x='24' y='316' width='772' height='112' rx='10' fill='#f6f8fa' stroke='#d0d7de'/><text x='40' y='340' font-size='13' font-weight='600' fill='#59636e' text-anchor='start'>Drivers and services · register level, no HAL</text><rect x='40.0' y='352' width='135.2' height='60' rx='8' fill='#ffffff' stroke='#8c959f' stroke-width='1'/><text x='107.6' y='377' font-size='14' font-weight='600' fill='#1f2328' text-anchor='middle'>I2C1 driver</text><text x='107.6' y='397' font-size='12' font-weight='400' fill='#59636e' text-anchor='middle'>400 kHz, timeouts</text><rect x='191.2' y='352' width='135.2' height='60' rx='8' fill='#ffffff' stroke='#8c959f' stroke-width='1'/><text x='258.79999999999995' y='377' font-size='14' font-weight='600' fill='#1f2328' text-anchor='middle'>Clock</text><text x='258.79999999999995' y='397' font-size='12' font-weight='400' fill='#59636e' text-anchor='middle'>HSE → 168 MHz PLL</text><rect x='342.4' y='352' width='135.2' height='60' rx='8' fill='#ffffff' stroke='#8c959f' stroke-width='1'/><text x='410.0' y='377' font-size='14' font-weight='600' fill='#1f2328' text-anchor='middle'>DWT</text><text x='410.0' y='397' font-size='12' font-weight='400' fill='#59636e' text-anchor='middle'>cycle counter</text><rect x='493.6' y='352' width='135.2' height='60' rx='8' fill='#ffffff' stroke='#8c959f' stroke-width='1'/><text x='561.1999999999999' y='377' font-size='14' font-weight='600' fill='#1f2328' text-anchor='middle'>TIM2</text><text x='561.1999999999999' y='397' font-size='12' font-weight='400' fill='#59636e' text-anchor='middle'>10 kHz load test</text><rect x='644.8' y='352' width='135.2' height='60' rx='8' fill='#ffffff' stroke='#8c959f' stroke-width='1'/><text x='712.4' y='377' font-size='14' font-weight='600' fill='#1f2328' text-anchor='middle'>Fault handler</text><text x='712.4' y='397' font-size='12' font-weight='400' fill='#59636e' text-anchor='middle'>CFSR crash record</text><rect x='24' y='444' width='772' height='112' rx='10' fill='#f6f8fa' stroke='#d0d7de'/><text x='40' y='468' font-size='13' font-weight='600' fill='#59636e' text-anchor='start'>Hardware</text><rect x='40.0' y='480' width='236.0' height='60' rx='8' fill='#ffffff' stroke='#8c959f' stroke-width='1'/><text x='158.0' y='505' font-size='14' font-weight='600' fill='#1f2328' text-anchor='middle'>STM32F407VG</text><text x='158.0' y='525' font-size='12' font-weight='400' fill='#59636e' text-anchor='middle'>Cortex-M4F, 168 MHz</text><rect x='292.0' y='480' width='236.0' height='60' rx='8' fill='#ffffff' stroke='#8c959f' stroke-width='1'/><text x='410.0' y='505' font-size='14' font-weight='600' fill='#1f2328' text-anchor='middle'>MPU-6050</text><text x='410.0' y='525' font-size='12' font-weight='400' fill='#59636e' text-anchor='middle'>6-axis IMU on I2C1</text><rect x='544.0' y='480' width='236.0' height='60' rx='8' fill='#ffffff' stroke='#8c959f' stroke-width='1'/><text x='662.0' y='505' font-size='14' font-weight='600' fill='#1f2328' text-anchor='middle'>ST-LINK V2-1</text><text x='662.0' y='525' font-size='12' font-weight='400' fill='#59636e' text-anchor='middle'>OpenOCD + GDB</text><text x='24' y='586' font-size='12' font-weight='400' fill='#59636e' text-anchor='start'>Highlighted: the scheduler, rewritten from an O(n) task scan to an O(1) ready bitmap.</text></svg>