<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 820 832' width='820' height='832' role='img' aria-label="Context switch sequence on Cortex-M4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Context switch sequence on Cortex-M4</title><rect x='0.5' y='0.5' width='819' height='831' rx='12' fill='#ffffff' stroke='#d0d7de'/><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#8c959f'/></marker></defs><text x='24' y='40' font-size='18' font-weight='600' fill='#1f2328' text-anchor='start'>One context switch: two steps done by hardware, three by PendSV</text><rect x='24' y='58' width='248' height='728' rx='10' fill='#f6f8fa'/><text x='148' y='86' font-size='13' font-weight='600' fill='#59636e' text-anchor='middle'>Task (thread mode)</text><rect x='286' y='58' width='248' height='728' rx='10' fill='#f6f8fa'/><text x='410' y='86' font-size='13' font-weight='600' fill='#59636e' text-anchor='middle'>Hardware (automatic)</text><rect x='548' y='58' width='248' height='728' rx='10' fill='#f6f8fa'/><text x='672' y='86' font-size='13' font-weight='600' fill='#59636e' text-anchor='middle'>PendSV handler (assembly)</text><path d='M254.0 153.0H410V212' fill='none' stroke='#8c959f' stroke-width='1.4' marker-end='url(#a)'/><path d='M516.0 249.0H672V308' fill='none' stroke='#8c959f' stroke-width='1.4' marker-end='url(#a)'/><path d='M672 382V404' fill='none' stroke='#8c959f' stroke-width='1.4' marker-end='url(#a)'/><path d='M672 478V500' fill='none' stroke='#8c959f' stroke-width='1.4' marker-end='url(#a)'/><path d='M566.0 537.0H410V596' fill='none' stroke='#8c959f' stroke-width='1.4' marker-end='url(#a)'/><path d='M304.0 633.0H148V692' fill='none' stroke='#8c959f' stroke-width='1.4' marker-end='url(#a)'/><rect x='42.0' y='116' width='212' height='74' rx='8' fill='#ffffff' stroke='#8c959f' stroke-width='1'/><text x='148' y='141' font-size='14' font-weight='600' fill='#1f2328' text-anchor='middle'>1. Task A yields</text><text x='148' y='162' font-size='12' font-weight='400' fill='#59636e' text-anchor='middle'>t0 = CYCCNT; os_yield()</text><text x='148' y='179' font-size='12' font-weight='400' fill='#59636e' text-anchor='middle'>sets PendSV pending</text><rect x='304.0' y='212' width='212' height='74' rx='8' fill='#ffffff' stroke='#8c959f' stroke-width='1'/><text x='410' y='237' font-size='14' font-weight='600' fill='#1f2328' text-anchor='middle'>2. Exception entry</text><text x='410' y='258' font-size='12' font-weight='400' fill='#59636e' text-anchor='middle'>pushes R0–R3, R12, LR,</text><text x='410' y='275' font-size='12' font-weight='400' fill='#59636e' text-anchor='middle'>PC, xPSR onto A's stack</text><rect x='566.0' y='308' width='212' height='74' rx='8' fill='#ffffff' stroke='#8c959f' stroke-width='1'/><text x='672' y='333' font-size='14' font-weight='600' fill='#1f2328' text-anchor='middle'>3. Save task A</text><text x='672' y='354' font-size='12' font-weight='400' fill='#59636e' text-anchor='middle'>pushes R4–R11, EXC_RETURN</text><text x='672' y='371' font-size='12' font-weight='400' fill='#59636e' text-anchor='middle'>(+S16–S31), SP into TCB</text><rect x='566.0' y='404' width='212' height='74' rx='8' fill='#e8f1fb' stroke='#2a78d6' stroke-width='2'/><text x='672' y='429' font-size='14' font-weight='600' fill='#1f2328' text-anchor='middle'>4. Pick next task</text><text x='672' y='450' font-size='12' font-weight='400' fill='#59636e' text-anchor='middle'>os_sched_select()</text><text x='672' y='467' font-size='12' font-weight='400' fill='#59636e' text-anchor='middle'>31 − CLZ(ready bitmap)</text><rect x='566.0' y='500' width='212' height='74' rx='8' fill='#ffffff' stroke='#8c959f' stroke-width='1'/><text x='672' y='525' font-size='14' font-weight='600' fill='#1f2328' text-anchor='middle'>5. Restore task B</text><text x='672' y='546' font-size='12' font-weight='400' fill='#59636e' text-anchor='middle'>loads B's SP, pops R4–R11</text><text x='672' y='563' font-size='12' font-weight='400' fill='#59636e' text-anchor='middle'>bx lr with B's EXC_RETURN</text><rect x='304.0' y='596' width='212' height='74' rx='8' fill='#ffffff' stroke='#8c959f' stroke-width='1'/><text x='410' y='621' font-size='14' font-weight='600' fill='#1f2328' text-anchor='middle'>6. Exception return</text><text x='410' y='642' font-size='12' font-weight='400' fill='#59636e' text-anchor='middle'>hardware pops</text><text x='410' y='659' font-size='12' font-weight='400' fill='#59636e' text-anchor='middle'>B's saved frame</text><rect x='42.0' y='692' width='212' height='74' rx='8' fill='#ffffff' stroke='#8c959f' stroke-width='1'/><text x='148' y='717' font-size='14' font-weight='600' fill='#1f2328' text-anchor='middle'>7. Task B resumes</text><text x='148' y='738' font-size='12' font-weight='400' fill='#59636e' text-anchor='middle'>t1 = CYCCNT</text><text x='148' y='755' font-size='12' font-weight='400' fill='#59636e' text-anchor='middle'>sample = t1 − t0 − 1</text><line x1='52' x2='52' y1='190' y2='692' stroke='#8c959f' stroke-width='1.5' stroke-dasharray='5 5'/><text x='64' y='412' font-size='14' font-weight='600' fill='#1f2328' text-anchor='start'>Measured window</text><text x='64' y='434' font-size='12' font-weight='400' fill='#59636e' text-anchor='start'>O(n) scheduler: 234 cycles</text><text x='64' y='452' font-size='12' font-weight='400' fill='#59636e' text-anchor='start'>O(1) scheduler: 104 cycles</text><text x='24' y='814' font-size='12' font-weight='400' fill='#59636e' text-anchor='start'>Highlighted: step 4 is the only step that differs between the two schedulers.</text></svg>