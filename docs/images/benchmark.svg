<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 820 400' width='820' height='400' role='img' aria-label="An O(1) scheduler cut the context switch from 234 to 104 cycles" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><title>An O(1) scheduler cut the context switch from 234 to 104 cycles</title><rect x='0.5' y='0.5' width='819' height='399' rx='12' fill='#ffffff' stroke='#d0d7de'/><text x='32' y='44' font-size='18' font-weight='600' fill='#1f2328' text-anchor='start'>An O(1) scheduler cut the context switch from 234 to 104 cycles (−55%)</text><text x='32' y='68' font-size='13' font-weight='400' fill='#59636e' text-anchor='start'>Full yield-to-resume latency, average of 10,000 switches · STM32F407 at 168 MHz, -O2</text><rect x='32' y='87' width='14' height='14' rx='3' fill='#afb8c1'/><text x='52' y='98' font-size='13' font-weight='400' fill='#1f2328' text-anchor='start'>Linear scan, O(n)</text><rect x='200' y='87' width='14' height='14' rx='3' fill='#2a78d6'/><text x='220' y='98' font-size='13' font-weight='400' fill='#1f2328' text-anchor='start'>Ready bitmap + CLZ, O(1)</text><line x1='210.0' x2='210.0' y1='124' y2='352' stroke='#eaeef2'/><text x='210.0' y='372' font-size='12' font-weight='400' fill='#59636e' text-anchor='middle'>0</text><line x1='335.0' x2='335.0' y1='124' y2='352' stroke='#eaeef2'/><text x='335.0' y='372' font-size='12' font-weight='400' fill='#59636e' text-anchor='middle'>80</text><line x1='460.0' x2='460.0' y1='124' y2='352' stroke='#eaeef2'/><text x='460.0' y='372' font-size='12' font-weight='400' fill='#59636e' text-anchor='middle'>160</text><line x1='585.0' x2='585.0' y1='124' y2='352' stroke='#eaeef2'/><text x='585.0' y='372' font-size='12' font-weight='400' fill='#59636e' text-anchor='middle'>240</text><line x1='710.0' x2='710.0' y1='124' y2='352' stroke='#eaeef2'/><text x='710.0' y='372' font-size='12' font-weight='400' fill='#59636e' text-anchor='middle'>320</text><text x='460.0' y='394' font-size='12' font-weight='400' fill='#59636e' text-anchor='middle'>CPU cycles per context switch</text><text x='32' y='166' font-size='14' font-weight='600' fill='#1f2328' text-anchor='start'>Integer tasks</text><text x='32' y='186' font-size='12' font-weight='400' fill='#59636e' text-anchor='start'>only R4–R11 saved</text><rect x='210' y='148' width='365.6' height='26' rx='4' fill='#afb8c1'><title>Integer tasks, O(n): 234 cycles</title></rect><text x='583.625' y='166' font-size='13' font-weight='400' fill='#1f2328' text-anchor='start'>234 cycles</text><rect x='210' y='182' width='162.5' height='26' rx='4' fill='#2a78d6'><title>Integer tasks, O(1): 104 cycles</title></rect><text x='380.5' y='200' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>104 cycles</text><text x='32' y='274' font-size='14' font-weight='600' fill='#1f2328' text-anchor='start'>FPU context</text><text x='32' y='294' font-size='12' font-weight='400' fill='#59636e' text-anchor='start'>S16–S31 saved too</text><rect x='210' y='256' width='471.9' height='26' rx='4' fill='#afb8c1'><title>FPU context, O(n): 302 cycles</title></rect><text x='689.875' y='274' font-size='13' font-weight='400' fill='#1f2328' text-anchor='start'>302 cycles</text><rect x='210' y='290' width='267.2' height='26' rx='4' fill='#2a78d6'><title>FPU context, O(1): 171 cycles</title></rect><text x='485.1875' y='308' font-size='13' font-weight='600' fill='#1f2328' text-anchor='start'>171 cycles</text><line x1='210' x2='210' y1='124' y2='352' stroke='#8c959f'/></svg>